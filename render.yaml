# Blueprint do Render (opcional): New + > Blueprint > escolher este repositório.
services:
  - type: web
    name: saferoute-api
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_URL
        value: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
