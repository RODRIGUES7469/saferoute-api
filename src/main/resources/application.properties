spring.application.name=saferoute-api

# Porta: o Render informa a porta pela variavel PORT; localmente usa 8080
server.port=${PORT:8080}

# Banco de dados Oracle da FIAP (credenciais SEMPRE por variavel de ambiente)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Poucas conexoes: o servidor da FIAP limita conexoes por aluno
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
# A API sobe mesmo se o banco estiver fora do ar (o erro vira resposta 503)
spring.datasource.hikari.initialization-fail-timeout=-1

# JSON
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
